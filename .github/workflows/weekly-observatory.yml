name: Weekly Observatory Pipeline

on:
  schedule:
    # 00:17 UTC Monday. This is 02:17 CEST / 01:17 CET in the Netherlands.
    # The non-zero minute avoids the busiest scheduled-run boundary.
    - cron: "17 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aieo-weekly-pipeline
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.week.outputs.release_id }}
      period_start: ${{ steps.week.outputs.period_start }}
      period_end: ${{ steps.week.outputs.period_end }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check the code before collecting or loading large models
        run: |
          python -m pip install -r requirements-relationship.txt PyYAML
          python -m unittest discover -s tests -v
      - name: Pin the completed week and verify all five markets
        id: week
        run: python scripts/plan_weekly_collection.py

  collect:
    needs: plan
    uses: ./.github/workflows/update-observatory.yml
    secrets: inherit

  translate:
    needs: collect
    uses: ./.github/workflows/translate-news.yml
    secrets: inherit

  enrich-article-bodies:
    needs: collect
    uses: ./.github/workflows/enrich-new-brief-article-bodies.yml
    with:
      scope: latest_collection
      retry_mode: retryable
    secrets: inherit

  resolve-events:
    needs: translate
    uses: ./.github/workflows/resolve-events.yml
    secrets: inherit

  reconcile-history:
    needs: resolve-events
    uses: ./.github/workflows/reconcile-observatory-history.yml
    with:
      mode: auto
      dry_run: false
    secrets: inherit

  classify-dual-lenses:
    needs: [reconcile-history, enrich-article-bodies]
    uses: ./.github/workflows/classify-dual-lenses.yml
    secrets: inherit

  finalize-residual:
    needs: classify-dual-lenses
    uses: ./.github/workflows/finalize-stage7c-residual.yml
    secrets: inherit

  build-weekly-release:
    needs: [plan, finalize-residual]
    uses: ./.github/workflows/build-weekly-release.yml
    with:
      period_start: ${{ needs.plan.outputs.period_start }}
      period_end: ${{ needs.plan.outputs.period_end }}
      replace: false
      revision_reason: ""
      rebuild_index_only: false
    secrets: inherit

  relationship-release-boundary:
    needs: [plan, build-weekly-release]
    uses: ./.github/workflows/publish-symbiosis-release.yml
    with:
      release_id: ${{ needs.plan.outputs.release_id }}
      require_complete: false
      placeholder: true
    secrets: inherit

  classify-relationships:
    needs: [plan, relationship-release-boundary]
    uses: ./.github/workflows/classify-current-symbiosis.yml
    with:
      lens: both
      replace: false
      release_id: ${{ needs.plan.outputs.release_id }}
    secrets: inherit

  relationship-signal:
    needs: [plan, classify-relationships]
    uses: ./.github/workflows/publish-symbiosis-release.yml
    with:
      release_id: ${{ needs.plan.outputs.release_id }}
      require_complete: false
      placeholder: false
    secrets: inherit

  period-summaries:
    needs: relationship-signal
    uses: ./.github/workflows/build-period-summaries.yml
    secrets: inherit

  public-insights:
    needs: period-summaries
    uses: ./.github/workflows/generate-public-insights.yml
    secrets: inherit

  public-brief:
    needs: public-insights
    uses: ./.github/workflows/generate-public-brief.yml
    secrets: inherit

  publish-site:
    needs: public-brief
    uses: ./.github/workflows/publish-observatory-release.yml
    secrets: inherit

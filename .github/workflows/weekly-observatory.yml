name: Weekly Observatory Pipeline

on:
  schedule:
    # 00:17 UTC Monday. This is 02:17 CEST / 01:17 CET in the Netherlands.
    # The non-zero minute avoids the busiest scheduled-run boundary.
    - cron: "17 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aieo-weekly-pipeline
  cancel-in-progress: false

jobs:
  collect:
    uses: ./.github/workflows/update-observatory.yml
    secrets: inherit

  translate:
    needs: collect
    uses: ./.github/workflows/translate-news.yml
    secrets: inherit

  resolve-events:
    needs: translate
    uses: ./.github/workflows/resolve-events.yml
    secrets: inherit

  reconcile-history:
    needs: resolve-events
    uses: ./.github/workflows/reconcile-observatory-history.yml
    with:
      mode: auto
      dry_run: false
    secrets: inherit

  classify-dual-lenses:
    needs: reconcile-history
    uses: ./.github/workflows/classify-dual-lenses.yml
    secrets: inherit

  finalize-residual:
    needs: classify-dual-lenses
    uses: ./.github/workflows/finalize-stage7c-residual.yml
    secrets: inherit

  build-weekly-release:
    needs: finalize-residual
    uses: ./.github/workflows/build-weekly-release.yml
    with:
      period_start: ""
      period_end: ""
      replace: false
      revision_reason: ""
      rebuild_index_only: false
    secrets: inherit

  relationship-release-boundary:
    needs: build-weekly-release
    uses: ./.github/workflows/publish-symbiosis-release.yml
    with:
      release_id: ""
      require_complete: false
      placeholder: true
    secrets: inherit

  period-summaries:
    needs: relationship-release-boundary
    uses: ./.github/workflows/build-period-summaries.yml
    secrets: inherit

  public-insights:
    needs: period-summaries
    uses: ./.github/workflows/generate-public-insights.yml
    secrets: inherit

  public-brief:
    needs: public-insights
    uses: ./.github/workflows/generate-public-brief.yml
    secrets: inherit

  publish-site:
    needs: public-brief
    uses: ./.github/workflows/publish-observatory-release.yml
    secrets: inherit

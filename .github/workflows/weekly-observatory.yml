name: Continue Weekly Observatory Pipeline

on:
  workflow_run:
    workflows:
      - Update AI News Collection
    types:
      - completed

  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  orchestrate:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event != 'push'
        )
      }}

    runs-on: ubuntu-latest
    timeout-minutes: 900

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install API client dependency
        run: python -m pip install requests

      - name: Run the remaining weekly pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PIPELINE_REF: main
        run: python scripts/orchestrate_weekly.py

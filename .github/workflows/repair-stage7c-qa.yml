name: Repair Stage 7C QA Outputs

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write


jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Observatory repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Supabase client
        run: python -m pip install "supabase>=2.18,<3"

      - name: Repair QA queue and aggregate snapshots
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/repair_stage7c_qa.py

      - name: Propose repaired stage 7c outputs
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            review/classification/latest.json
            data/lenses/latest.json
          branch: automation/repair-stage7c-qa
          branch-suffix: timestamp
          sign-commits: true
          commit-message: Repair Stage 7C QA queue
          title: Repair Stage 7C QA queue
          body: |
            Automated Observatory output. Review the generated files before merging.

name: Repair Stage 7C QA Outputs

on:
  workflow_dispatch:

permissions:
  contents: write


jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Observatory repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Supabase client
        run: python -m pip install "supabase>=2.18,<3"

      - name: Repair QA queue and aggregate snapshots
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/repair_stage7c_qa.py

      - name: Commit repaired Stage 7C outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add review/classification/latest.json
          git add data/lenses/latest.json

          git diff --cached --quiet || \
            git commit -m "data: repair Stage 7C QA queue"

          git push

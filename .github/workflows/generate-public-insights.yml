name: Generate Public Observatory Insights

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aieo-public-insights
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generate release-bound public insights and history
        run: python scripts/generate_public_insights.py
      - name: Commit public insights and weekly history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/insights/latest.json data/history/releases.json
          if git diff --cached --quiet; then
            echo "No public-insight changes to commit."
            exit 0
          fi
          git commit -m "Update release-bound public insights"
          git push origin HEAD:main

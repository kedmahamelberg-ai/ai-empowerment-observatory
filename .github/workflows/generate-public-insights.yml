name: Generate Public Observatory Insights

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: aieo-public-insights
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generate release-bound public insights and history
        run: python scripts/generate_public_insights.py
      - name: Propose public insights and weekly history
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            data/insights/latest.json
            data/history/releases.json
          branch: automation/generate-public-insights
          branch-suffix: timestamp
          sign-commits: true
          commit-message: Update release-bound public insights
          title: Update release-bound public insights
          body: |
            Automated Observatory output. Review the generated files before merging.

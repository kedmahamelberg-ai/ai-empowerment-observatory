name: Ensure Weekly Observatory Collection

on:
  # Recheck immediately when the weekly schedule or this watchdog changes.
  # This also recovers the missing week when this fix reaches main.
  push:
    branches: [main]
    paths:
      - '.github/workflows/weekly-observatory.yml'
      - '.github/workflows/ensure-weekly-observatory.yml'
  schedule:
    # UTC fallbacks cover 00:32 and 00:47 Monday in both Dutch seasons.
    # Early Sunday checks in winter are harmless: the planner still targets
    # only the most recently completed Amsterdam week.
    - cron: '32,47 22,23 * * 0'
    - cron: '32,47 0 * * 1'
    # Later checks recover stalled publication and rate-limit interruptions.
    - cron: '17 2,7,10 * * 1'
      timezone: Europe/Amsterdam
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: aieo-weekly-watchdog
  cancel-in-progress: false

jobs:
  ensure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Recover the missing week or unpublished saved work when no release run is active
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/ensure_weekly_pipeline.py

name: Ensure Weekly Observatory Collection

on:
  schedule:
    # The main weekly pipeline starts Monday 00:17 Amsterdam time.
    # Check again for missed collection or stalled publication, including after rate limits reset.
    - cron: '17 1,2,7,10 * * 1'
      timezone: Europe/Amsterdam
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: aieo-weekly-watchdog
  cancel-in-progress: false

jobs:
  ensure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Recover the missing week or unpublished saved work when no release run is active
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/ensure_weekly_pipeline.py

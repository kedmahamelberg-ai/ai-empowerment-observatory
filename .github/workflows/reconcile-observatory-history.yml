name: Reconcile Observatory History

on:
  workflow_call:
    inputs:
      mode:
        required: false
        default: auto
        type: string
      dry_run:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      mode:
        description: "Reconciliation depth. Auto uses weekly/monthly/quarterly/annual cadence."
        required: true
        default: auto
        type: choice
        options: [auto, weekly, monthly, quarterly, annual, manual]
      dry_run:
        description: "Review candidates without applying event/story changes"
        required: true
        default: false
        type: boolean
permissions:
  contents: write

concurrency:
  group: aieo-history-reconciliation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      MODE: ${{ inputs.mode }}
      DRY_RUN: ${{ inputs.dry_run }}
      LLAMA_SERVER_BIN: /tmp/llama.cpp/build/bin/llama-server
      # Pilot governance: models propose; accepted decisions change history.
      AIEO_AUTO_APPLY_MODEL_SAME_EVENT: "false"
      AIEO_AUTO_LINK_MODEL_FOLLOW_ON: "false"

    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # The event-pair checkpoint now declares the Transformers v5
          # TokenizersBackend class. Keep reconciliation on the same tested
          # stack as the production resolver instead of allowing a v4 install.
          python -m pip install "transformers[torch]==5.14.1"
          python - <<'PY'
          import sentence_transformers
          import torch
          import transformers

          print("transformers", transformers.__version__)
          print("sentence-transformers", sentence_transformers.__version__)
          print("torch", torch.__version__)
          PY

      - name: Verify ModernBERT pair model stack
        run: |
          python - <<'PY'
          import torch
          from huggingface_hub import HfApi
          from transformers import AutoModelForSequenceClassification, AutoTokenizer

          model_name = "Juanillaberia/articles-pairs-event-detection"
          revision = HfApi().model_info(model_name).sha or "main"

          tokenizer = AutoTokenizer.from_pretrained(
              model_name,
              revision=revision,
          )
          model = AutoModelForSequenceClassification.from_pretrained(
              model_name,
              revision=revision,
          )
          model.eval()

          inputs = tokenizer(
              text="Government announces an AI policy",
              text_pair="A new AI policy is announced by the government",
              return_tensors="pt",
              truncation=True,
              max_length=32,
          )
          with torch.inference_mode():
              logits = model(**inputs).logits

          if logits.ndim != 2 or logits.shape[-1] < 2:
              raise RuntimeError(f"Unexpected pair-model logits shape: {tuple(logits.shape)}")

          print("Tokenizer:", tokenizer.__class__.__name__)
          print("Pair model:", model.__class__.__name__)
          print("Revision:", revision)
          print("Logits shape:", tuple(logits.shape))
          PY

      - name: Build llama.cpp server
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ggml-org/llama.cpp /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_CURL=OFF \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build /tmp/llama.cpp/build --config Release -j2 --target llama-server
          test -x "$LLAMA_SERVER_BIN"

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}" || { echo "SUPABASE_URL is missing"; exit 1; }
          if [[ -z "${SUPABASE_SECRET_KEY:-}" && -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]]; then
            echo "SUPABASE_SECRET_KEY or SUPABASE_SERVICE_ROLE_KEY is missing"
            exit 1
          fi

      - name: Reconcile long-term event memory
        shell: bash
        run: |
          set -euo pipefail
          args=(--mode "$MODE")
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python scripts/reconcile_event_history.py "${args[@]}"

      - name: Restate affected weekly releases
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          python scripts/restate_release_history.py --all \
            --reason "Longitudinal reconciliation changed new-versus-recurring assignments."

      - name: Upload private reconciliation review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: longitudinal-reconciliation-review-${{ github.run_id }}
          path: review/events/longitudinal/latest.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit public reconciliation and revised releases
        if: ${{ env.DRY_RUN != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/releases
          if git diff --cached --quiet; then
            echo "No public reconciliation or release changes to commit."
            exit 0
          fi
          git commit -m "Reconcile Observatory event history"
          git push origin HEAD:main

name: Reconcile Observatory History

on:
  workflow_call:
    inputs:
      mode:
        required: false
        default: auto
        type: string
      dry_run:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      mode:
        description: "Reconciliation depth. Auto uses weekly/monthly/quarterly/annual cadence."
        required: true
        default: auto
        type: choice
        options: [auto, weekly, monthly, quarterly, annual, manual]
      dry_run:
        description: "Review candidates without applying event/story changes"
        required: true
        default: false
        type: boolean
permissions:
  contents: write

concurrency:
  group: aieo-history-reconciliation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      MODE: ${{ inputs.mode }}
      DRY_RUN: ${{ inputs.dry_run }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AIEO_AI_PROVIDER: openai
      AIEO_AI_MAX_JOB_USD: ${{ vars.AIEO_AI_MAX_JOB_USD || '0.50' }}
      AIEO_AI_MAX_JOB_REQUESTS: ${{ vars.AIEO_AI_MAX_JOB_REQUESTS || '350' }}
      AIEO_AI_MAX_COMPLETION_TOKENS: '2048'
      # Pilot governance: models propose; accepted decisions change history.
      AIEO_AUTO_APPLY_MODEL_SAME_EVENT: "false"
      AIEO_AUTO_LINK_MODEL_FOLLOW_ON: "false"

    steps:
      - name: Check out latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verify scheduled API model and key
        run: python scripts/ai_runtime.py --preflight --export

      - name: Check resolver imports and human-gated API contract
        run: |
          python -c "import sys; sys.path.insert(0, 'scripts'); import resolve_events, reconcile_event_history"
          python -B -m unittest discover -s tests -p 'test_openai_event_verifier.py' -v

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}" || { echo "SUPABASE_URL is missing"; exit 1; }
          if [[ -z "${SUPABASE_SECRET_KEY:-}" && -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]]; then
            echo "SUPABASE_SECRET_KEY or SUPABASE_SERVICE_ROLE_KEY is missing"
            exit 1
          fi

      - name: Reconcile long-term event memory
        shell: bash
        run: |
          set -euo pipefail
          args=(--mode "$MODE")
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python scripts/reconcile_event_history.py "${args[@]}"

      - name: Restate affected weekly releases
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          python scripts/restate_release_history.py --all \
            --reason "Longitudinal reconciliation changed new-versus-recurring assignments."

      - name: Upload private reconciliation review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: longitudinal-reconciliation-review-${{ github.run_id }}
          path: review/events/longitudinal/latest.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Authorize this generated-data commit
        if: ${{ env.DRY_RUN != 'true' }}
        uses: ./.github/actions/authorize-publisher
        with:
          private-key: ${{ secrets.SCHEDULED_PUBLISHER_PRIVATE_KEY }}
      - name: Commit public reconciliation and revised releases
        if: ${{ env.DRY_RUN != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/releases
          if git diff --cached --quiet; then
            echo "No public reconciliation or release changes to commit."
            exit 0
          fi
          git commit -m "Reconcile Observatory event history"
          git push origin HEAD:main


      - name: Report bounded API usage
        if: always()
        run: python scripts/ai_runtime.py --report
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: history-reconciliation-api-usage
          path: .ai-usage/
          include-hidden-files: true
          if-no-files-found: ignore

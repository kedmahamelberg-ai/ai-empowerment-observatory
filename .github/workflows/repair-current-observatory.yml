name: Repair Current Observatory Release

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aieo-current-release-repair
  cancel-in-progress: false

jobs:
  restate-history:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Restate standardized weekly novelty from canonical history
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: >-
          python scripts/restate_release_history.py --all
          --reason "Correct public novelty semantics: collection retries and rediscovery do not by themselves make a development recurring."
      - name: Commit corrected releases and revision archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/releases/current.json data/releases/index.json data/releases/weekly
          if git diff --cached --quiet; then
            echo "No release-history changes were needed."
          else
            git commit -m "Correct Observatory weekly novelty semantics"
            git push origin HEAD:main
          fi

  reset-relationship-boundary:
    needs: restate-history
    uses: ./.github/workflows/publish-symbiosis-release.yml
    with:
      release_id: ""
      require_complete: false
      placeholder: true
    secrets: inherit

  period-summaries:
    needs: reset-relationship-boundary
    uses: ./.github/workflows/build-period-summaries.yml
    secrets: inherit

  public-insights:
    needs: period-summaries
    uses: ./.github/workflows/generate-public-insights.yml
    secrets: inherit

  public-brief:
    needs: public-insights
    uses: ./.github/workflows/generate-public-brief.yml
    secrets: inherit

  classify-relationship:
    needs: public-brief
    uses: ./.github/workflows/classify-current-symbiosis.yml
    with:
      lens: both
      replace: false
    secrets: inherit

  publish-relationship:
    needs: classify-relationship
    uses: ./.github/workflows/publish-symbiosis-release.yml
    with:
      release_id: ""
      require_complete: false
      placeholder: false
    secrets: inherit

  publish-site:
    needs: publish-relationship
    uses: ./.github/workflows/publish-observatory-release.yml
    secrets: inherit

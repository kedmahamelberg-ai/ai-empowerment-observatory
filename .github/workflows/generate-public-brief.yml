name: Generate Public Observatory Brief

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aieo-public-brief
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PDF dependency
        run: python -m pip install "reportlab>=4.4,<5"
      - name: Generate the release-bound public brief
        run: python scripts/generate_public_brief.py
      - name: Commit the report and metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ai-empowerment-pulse-latest.pdf data/reports/latest.json
          if git diff --cached --quiet; then
            echo "No public-brief changes to commit."
            exit 0
          fi
          git commit -m "Generate current AI Empowerment Pulse"
          git push origin HEAD:main

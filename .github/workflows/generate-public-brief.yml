name: Generate Public Observatory Brief

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PDF dependency
        run: python -m pip install "reportlab>=4.4,<5"

      - name: Generate the three-page public brief
        run: python scripts/generate_public_brief.py

      - name: Commit the report and metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add reports/ai-empowerment-pulse-latest.pdf
          git add data/reports/latest.json

          git diff --cached --quiet || \
            git commit -m "data: generate current AI Empowerment Pulse"

          git push

      - name: Build public site artifact
        run: python scripts/build_public_site.py

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

  deploy:
    needs: generate
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

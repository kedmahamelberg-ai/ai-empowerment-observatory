name: Generate Public Observatory Brief

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: aieo-public-brief
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install PDF dependency
        run: python -m pip install "reportlab>=4.4,<5"
      - name: Generate the release-bound public brief
        run: python scripts/generate_public_brief.py
      - name: Propose the report and metadata
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            reports/ai-empowerment-pulse-latest.pdf
            data/reports/latest.json
          branch: automation/generate-public-brief
          branch-suffix: timestamp
          sign-commits: true
          commit-message: Generate current AI Empowerment Pulse
          title: Generate current AI Empowerment Pulse
          body: |
            Automated Observatory output. Review the generated files before merging.

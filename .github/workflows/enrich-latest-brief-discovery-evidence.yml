name: Enrich Latest AIEO Brief Discovery Evidence

on:
  workflow_run:
    workflows:
      - Update AI News Collection
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aieo-brief-latest-discovery-evidence
  cancel-in-progress: false

jobs:
  enrich:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install "supabase>=2,<3"
      - name: Preserve latest Google News snippets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RAW_NEWS_BUCKET: raw-news
        run: python scripts/brief_recover_discovery_evidence.py --latest-only

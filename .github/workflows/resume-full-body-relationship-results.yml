name: Deprecated Full-Body Relationship Resume

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stop:
    name: Stop before a classification or publication run
    runs-on: ubuntu-latest
    steps:
      - name: Explain the replacement path
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::This workflow is retired. First run 'Recover Missing Full Article Bodies', download the private audit, and decide whether another classification run is justified."
          exit 1

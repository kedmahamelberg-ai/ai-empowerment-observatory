name: Benchmark Same Event Verifiers

on:
  workflow_dispatch:

permissions:
  contents: write


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Observatory repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install benchmark dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "transformers[torch]==5.14.1" pandas

      - name: Verify Transformers tokenizer backend
        run: |
          python - <<'PY'
          import transformers
          from transformers import AutoTokenizer

          print("Transformers:", transformers.__version__)

          tokenizer = AutoTokenizer.from_pretrained(
              "Juanillaberia/articles-pairs-event-detection"
          )

          print("Tokenizer:", tokenizer.__class__.__name__)
          PY

      - name: Install llama.cpp build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcurl4-openssl-dev

      - name: Build llama.cpp server
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp

          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DLLAMA_CURL=ON

          cmake --build /tmp/llama.cpp/build \
            --target llama-server \
            -j2

      - name: Benchmark same-event verifiers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          LLAMA_SERVER_BIN: /tmp/llama.cpp/build/bin/llama-server
        run: python scripts/benchmark_event_verifier.py

      - name: Commit benchmark result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add review/events/verifier-benchmark/latest.json

          git diff --cached --quiet || \
            git commit -m "data: benchmark same-event verifiers"

          git push

name: Deprecated Full-Body Recovery Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stop:
    name: Use Recover Missing Full Article Bodies instead
    runs-on: ubuntu-latest
    steps:
      - name: Stop before any repository or classification work
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::This installer is retired. Run 'Recover Missing Full Article Bodies' instead. It only retries missing public source bodies and writes a private audit."
          exit 1

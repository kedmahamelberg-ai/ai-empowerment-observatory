      - name: Verify the installed files before committing
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/classify_symbiosis.py \
            scripts/check_symbiosis_resume.py \
            scripts/symbiosis_common.py \
            scripts/validate_symbiosis_resilience.py \
            scripts/create_symbiosis_placeholder.py \
            scripts/publish_symbiosis_release.py \
            scripts/validate_public_relationship_consistency.py \
            scripts/validate_repository_integrity.py
          python scripts/validate_repository_integrity.py
          python scripts/validate_symbiosis_resilience.py
          node --check site.js
          node --check edu/dashboard.js

      - name: Commit the complete recovery patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/classify-current-symbiosis.yml \
            .github/workflows/repository-integrity.yml \
            .github/workflows/resume-full-body-relationship-results.yml \
            scripts/check_symbiosis_resume.py \
            scripts/classify_symbiosis.py \
            scripts/create_symbiosis_placeholder.py \
            scripts/publish_symbiosis_release.py \
            scripts/symbiosis_common.py \
            scripts/validate_public_relationship_consistency.py \
            scripts/validate_repository_integrity.py \
            scripts/validate_symbiosis_resilience.py \
            site.js \
            index.html \
            edu/dashboard.js \
            edu/index.html \
            FULL-BODY-RECOVERY-README.txt \
            RECOVERY-PATCH-MANIFEST.sha256
          if git diff --cached --quiet; then
            echo "The complete recovery patch is already installed."
          else
            git commit -m "Install verified full-body relationship recovery"
            git push origin HEAD:main
          fi

name: Generate Model Agreed Positive Event Pairs

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Observatory repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install verifier dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "transformers[torch]==5.14.1" pandas

      - name: Verify ModernBERT tokenizer
        run: |
          python - <<'PY'
          from transformers import AutoTokenizer

          tokenizer = AutoTokenizer.from_pretrained(
              "Juanillaberia/articles-pairs-event-detection"
          )

          print("Tokenizer:", tokenizer.__class__.__name__)
          PY

      - name: Install llama.cpp build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcurl4-openssl-dev

      - name: Build llama.cpp server
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp

          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DLLAMA_CURL=ON

          cmake --build /tmp/llama.cpp/build \
            --target llama-server \
            -j2

      - name: Generate model-agreed positive pairs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          LLAMA_SERVER_BIN: /tmp/llama.cpp/build/bin/llama-server
        run: python scripts/generate_positive_event_pairs.py

      - name: Propose positive-enrichment sample
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            review/events/positive-enrichment/latest.json
            validation/event_pair_hard_negatives_v1.csv
            validation/event_pair_story_coverage_v1.csv
          branch: automation/positive-event-pairs
          branch-suffix: timestamp
          sign-commits: true
          commit-message: Add positive event-pair enrichment sample
          title: Add positive event-pair enrichment sample
          body: |
            Automated Observatory output. Review the generated files before merging.

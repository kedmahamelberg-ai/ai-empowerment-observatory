name: Backfill AIEO Brief Article Content

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Inspect outcomes without writing snapshots or attempt rows"
        required: true
        default: false
        type: boolean
      limit:
        description: "Maximum articles this run. Use 0 for as many as fit inside the runtime budget."
        required: true
        default: "0"
        type: string
      retry_mode:
        description: "Previously attempted articles eligible for retry"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - retryable
          - all
      max_runtime_minutes:
        description: "Graceful stop before GitHub's job timeout"
        required: true
        default: "150"
        type: string

permissions:
  contents: read

concurrency:
  group: aieo-brief-content-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 175

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install extraction dependencies
        run: |
          python -m pip install \
            "supabase>=2,<3" \
            "requests>=2.32,<3" \
            "beautifulsoup4>=4.12,<5" \
            "trafilatura>=2,<3"

      - name: Validate secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SECRET_KEY"

      - name: Backfill article bodies
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --limit "${{ inputs.limit }}"
            --retry-mode "${{ inputs.retry_mode }}"
            --max-runtime-minutes "${{ inputs.max_runtime_minutes }}"
          )
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          python scripts/brief_backfill_article_content_resumable.py "${args[@]}"

      - name: Audit stored snapshots
        if: ${{ inputs.dry_run == false }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python scripts/audit_brief_article_content.py --limit 30

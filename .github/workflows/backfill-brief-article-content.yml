name: Backfill AIEO Brief Article Content

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Inspect fetch outcomes without writing snapshots"
        required: true
        default: true
        type: boolean
      limit:
        description: "Maximum number of articles in this run. Use 0 for all."
        required: true
        default: "25"
        type: string
      retry_existing:
        description: "Retry articles that already have a current full-text snapshot"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: aieo-brief-content-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install extraction dependencies
        run: |
          python -m pip install \
            "supabase>=2,<3" \
            "requests>=2.32,<3" \
            "beautifulsoup4>=4.12,<5" \
            "trafilatura>=2,<3"
      - name: Validate secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SECRET_KEY"
      - name: Backfill article bodies
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--limit "${{ inputs.limit }}")
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then args+=(--dry-run); fi
          if [[ "${{ inputs.retry_existing }}" == "true" ]]; then args+=(--retry-existing); fi
          python scripts/brief_backfill_article_content.py "${args[@]}"
      - name: Audit stored snapshots
        if: ${{ inputs.dry_run == false }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python scripts/audit_brief_article_content.py --limit 20

name: Apply Stage 7C Human Audit

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write


jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Observatory repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Supabase client
        run: python -m pip install "supabase>=2.18,<3"

      - name: Apply the completed Stage 7C audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/apply_stage7c_audit.py

      - name: Propose audited lens outputs
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            validation/aieo-stage7c-classification-audit.csv
            validation/stage7c-corrections-v1.json
            review/classification/latest.json
            data/lenses/latest.json
            data/methodology/latest.json
          branch: automation/apply-stage7c-audit
          branch-suffix: timestamp
          sign-commits: true
          commit-message: Apply Stage 7C human governance audit
          title: Apply Stage 7C human governance audit
          body: |
            Automated Observatory output. Review the generated files before merging.

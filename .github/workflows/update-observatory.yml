name: Update AI News Collection

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect and persist weekly news candidates
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/collect_news.py

      - name: Propose current public review files
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            data/review/latest.json
            data/review/latest.csv
            data/collection_status.json
          branch: automation/observatory-news-review
          branch-suffix: timestamp
          sign-commits: true
          commit-message: Refresh public AI news review
          title: Refresh public AI news review
          body: |
            Automated news review data. Review the collected sources before merging.

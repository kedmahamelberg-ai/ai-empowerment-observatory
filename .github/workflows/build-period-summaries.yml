name: Build Observatory Period Summaries

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: aieo-period-summaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build monthly, quarterly and annual summaries
        run: python scripts/build_period_summaries.py
      - name: Validate period index
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("data/releases/period-index.json")
          if not path.exists():
              raise SystemExit("period-index.json was not generated")
          data = json.loads(path.read_text(encoding="utf-8"))
          if data.get("schema_version") != "aieo_period_index_v1.1":
              raise SystemExit("Unexpected period-index schema")
          if not data.get("summaries"):
              raise SystemExit("No period summaries were generated")
          for row in data["summaries"]:
              if not str(row.get("path") or "").startswith("/data/releases/"):
                  raise SystemExit(f"Invalid period path: {row}")
          print("Validated", len(data["summaries"]), "period summaries")
          PY
      - name: Stage ignored release files
        run: git add -f data/releases/monthly data/releases/quarterly data/releases/annual data/releases/period-index.json
      - name: Propose period summaries
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            data/releases/monthly
            data/releases/quarterly
            data/releases/annual
            data/releases/period-index.json
          branch: automation/build-period-summaries
          branch-suffix: timestamp
          sign-commits: true
          commit-message: Update Observatory period summaries
          title: Update Observatory period summaries
          body: |
            Automated Observatory output. Review the generated files before merging.

name: Benchmark English Translation

on:
  workflow_dispatch:

permissions:
  contents: write


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache Qwen model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-qwen3-1.7b-translation-benchmark-v1

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate blind translation benchmark
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/benchmark_translation.py

      - name: Commit benchmark sample safely
        run: |
          bash scripts/commit_generated_file.sh \
            review/translations/benchmark/latest.json \
            "data: generate blind translation benchmark" \
            main

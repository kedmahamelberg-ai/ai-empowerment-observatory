name: Classify Current Human-AI Relationship Patterns

on:
  workflow_call:
    inputs:
      lens:
        required: false
        default: both
        type: string
      replace:
        required: false
        default: false
        type: boolean
      resume_only:
        required: false
        default: false
        type: boolean
      release_id:
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      lens:
        description: "Classify both lenses or one lens only"
        required: true
        default: both
        type: choice
        options: [both, event, coverage]
      replace:
        description: "Reclassify units that already have this codebook version"
        required: true
        default: false
        type: boolean
      resume_only:
        description: "Resume the matching interrupted run; never start a new run"
        required: true
        default: false
        type: boolean
      release_id:
        description: "Weekly release ID; leave blank for current"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: symbiosis-classification-${{ github.repository }}
  cancel-in-progress: false

jobs:
  pass_1:
    name: Classification pass 1
    runs-on: ubuntu-latest
    timeout-minutes: 285
    outputs:
      complete: ${{ steps.symbiosis.outputs.complete }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      LLAMA_SERVER_BIN: /tmp/llama.cpp/build/bin/llama-server
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate symbiosis resilience contract
        run: python scripts/validate_symbiosis_resilience.py
      - name: Cache Qwen model files
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-aieo-qwen3-4b-gguf-q4-k-m-v1
      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install -r requirements-relationship.txt PyYAML
          python -m unittest discover -s tests -v
      - name: Install llama.cpp build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcurl4-openssl-dev
      - name: Build llama.cpp server
        run: |
          set -euo pipefail
          git init /tmp/llama.cpp
          git -C /tmp/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C /tmp/llama.cpp fetch --depth 1 origin 427291b5b34cd914a31b3fd3b61a68f6184f4b9f
          git -C /tmp/llama.cpp checkout --detach FETCH_HEAD
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=ON
          cmake --build /tmp/llama.cpp/build --target llama-server -j2
      - name: Run bounded symbiosis classification pass 1
        id: symbiosis
        run: |
          set -euo pipefail
          status_file="$RUNNER_TEMP/symbiosis-status-${GITHUB_JOB}.json"
          args=(--scope latest --lens "${{ inputs.lens }}" --time-budget-minutes "225" --status-output "$status_file")
          if [[ -n "${{ inputs.release_id }}" ]]; then args+=(--release-id "${{ inputs.release_id }}"); fi
          if [[ "${{ inputs.replace }}" == "true" ]]; then args+=(--replace); fi
          if [[ "${{ inputs.resume_only }}" == "true" ]]; then args+=(--resume-only); fi
          python scripts/classify_symbiosis.py "${args[@]}"
          python - "$status_file" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          status_path, output_path = sys.argv[1:]
          with open(status_path, encoding="utf-8") as handle:
              status = json.load(handle)
          complete = "true" if status.get("complete") is True else "false"
          with open(output_path, "a", encoding="utf-8") as handle:
              handle.write(f"complete={complete}\n")
          print(json.dumps(status, indent=2))
          PY

      - name: Save pass diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: symbiosis-pass-1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/symbiosis-status-${{ github.job }}.json
          if-no-files-found: ignore
          retention-days: 14

  pass_2:
    name: Classification pass 2
    needs: pass_1
    if: ${{ always() && !cancelled() && needs.pass_1.outputs.complete != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 285
    outputs:
      complete: ${{ steps.symbiosis.outputs.complete }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      LLAMA_SERVER_BIN: /tmp/llama.cpp/build/bin/llama-server
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate symbiosis resilience contract
        run: python scripts/validate_symbiosis_resilience.py
      - name: Cache Qwen model files
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-aieo-qwen3-4b-gguf-q4-k-m-v1
      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install -r requirements-relationship.txt PyYAML
          python -m unittest discover -s tests -v
      - name: Install llama.cpp build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcurl4-openssl-dev
      - name: Build llama.cpp server
        run: |
          set -euo pipefail
          git init /tmp/llama.cpp
          git -C /tmp/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C /tmp/llama.cpp fetch --depth 1 origin 427291b5b34cd914a31b3fd3b61a68f6184f4b9f
          git -C /tmp/llama.cpp checkout --detach FETCH_HEAD
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=ON
          cmake --build /tmp/llama.cpp/build --target llama-server -j2
      - name: Resume bounded symbiosis classification pass 2
        id: symbiosis
        run: |
          set -euo pipefail
          status_file="$RUNNER_TEMP/symbiosis-status-${GITHUB_JOB}.json"
          args=(--scope latest --lens "${{ inputs.lens }}" --time-budget-minutes "225" --status-output "$status_file")
          if [[ -n "${{ inputs.release_id }}" ]]; then args+=(--release-id "${{ inputs.release_id }}"); fi
          if [[ "${{ inputs.replace }}" == "true" ]]; then args+=(--replace); fi
          if [[ "${{ inputs.resume_only }}" == "true" ]]; then args+=(--resume-only); fi
          python scripts/classify_symbiosis.py "${args[@]}"
          python - "$status_file" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          status_path, output_path = sys.argv[1:]
          with open(status_path, encoding="utf-8") as handle:
              status = json.load(handle)
          complete = "true" if status.get("complete") is True else "false"
          with open(output_path, "a", encoding="utf-8") as handle:
              handle.write(f"complete={complete}\n")
          print(json.dumps(status, indent=2))
          PY

      - name: Save pass diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: symbiosis-pass-2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/symbiosis-status-${{ github.job }}.json
          if-no-files-found: ignore
          retention-days: 14

  pass_3:
    name: Classification pass 3
    needs: [pass_1, pass_2]
    if: >-
      always() &&
      !cancelled() &&
      needs.pass_1.outputs.complete != 'true' &&
      needs.pass_2.outputs.complete != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 285
    outputs:
      complete: ${{ steps.symbiosis.outputs.complete }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      LLAMA_SERVER_BIN: /tmp/llama.cpp/build/bin/llama-server
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate symbiosis resilience contract
        run: python scripts/validate_symbiosis_resilience.py
      - name: Cache Qwen model files
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-aieo-qwen3-4b-gguf-q4-k-m-v1
      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install -r requirements-relationship.txt PyYAML
          python -m unittest discover -s tests -v
      - name: Install llama.cpp build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcurl4-openssl-dev
      - name: Build llama.cpp server
        run: |
          set -euo pipefail
          git init /tmp/llama.cpp
          git -C /tmp/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C /tmp/llama.cpp fetch --depth 1 origin 427291b5b34cd914a31b3fd3b61a68f6184f4b9f
          git -C /tmp/llama.cpp checkout --detach FETCH_HEAD
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=ON
          cmake --build /tmp/llama.cpp/build --target llama-server -j2
      - name: Resume bounded symbiosis classification pass 3
        id: symbiosis
        run: |
          set -euo pipefail
          status_file="$RUNNER_TEMP/symbiosis-status-${GITHUB_JOB}.json"
          args=(--scope latest --lens "${{ inputs.lens }}" --time-budget-minutes "225" --status-output "$status_file")
          if [[ -n "${{ inputs.release_id }}" ]]; then args+=(--release-id "${{ inputs.release_id }}"); fi
          if [[ "${{ inputs.replace }}" == "true" ]]; then args+=(--replace); fi
          if [[ "${{ inputs.resume_only }}" == "true" ]]; then args+=(--resume-only); fi
          python scripts/classify_symbiosis.py "${args[@]}"
          python - "$status_file" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          status_path, output_path = sys.argv[1:]
          with open(status_path, encoding="utf-8") as handle:
              status = json.load(handle)
          complete = "true" if status.get("complete") is True else "false"
          with open(output_path, "a", encoding="utf-8") as handle:
              handle.write(f"complete={complete}\n")
          print(json.dumps(status, indent=2))
          PY

      - name: Save pass diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: symbiosis-pass-3-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/symbiosis-status-${{ github.job }}.json
          if-no-files-found: ignore
          retention-days: 14

  ensure_complete:
    name: Require complete relationship classification
    needs: [pass_1, pass_2, pass_3]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PASS_1_COMPLETE: ${{ needs.pass_1.outputs.complete }}
      PASS_2_COMPLETE: ${{ needs.pass_2.outputs.complete }}
      PASS_3_COMPLETE: ${{ needs.pass_3.outputs.complete }}
      PASS_1_RESULT: ${{ needs.pass_1.result }}
      PASS_2_RESULT: ${{ needs.pass_2.result }}
      PASS_3_RESULT: ${{ needs.pass_3.result }}
    steps:
      - name: Require a completed symbiosis run
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PASS_1_COMPLETE" == "true" || \
                "$PASS_2_COMPLETE" == "true" || \
                "$PASS_3_COMPLETE" == "true" ]]; then
            echo "Relationship classification completed successfully."
            exit 0
          fi
          echo "::error::Relationship results remain incomplete. Pass results: 1=$PASS_1_RESULT, 2=$PASS_2_RESULT, 3=$PASS_3_RESULT. Saved rows remain resumable; inspect the pass diagnostics. Publication is blocked."
          exit 1

  build_review_workbench:
    name: Build relationship review workbench
    needs: ensure_complete
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install review dependencies
        run: python -m pip install -r requirements-relationship.txt
      - name: Build self-contained review workbench
        run: python scripts/build_symbiosis_review_workbench.py --scope latest
      - name: Upload review workbench
        uses: actions/upload-artifact@v7
        with:
          name: current-symbiosis-review-${{ github.run_id }}
          path: |
            review/symbiosis/workbench.html
            review/symbiosis/workbench-data.json
          retention-days: 30

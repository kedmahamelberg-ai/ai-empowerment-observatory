name: Finalize Stage 7C Residual Rule

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Supabase client
        run: python -m pip install "supabase>=2.18,<3"
      - name: Repair QA queue and aggregate snapshots
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/finalize_stage7c_residual.py
      - name: Commit repaired Stage 7C outputs safely
        run: |
          bash scripts/commit_generated_files.sh \
            "data: finalize Stage 7C non-empowerment residual" \
            main review/classification/latest.json data/lenses/latest.json

name: Benchmark Chinese Translation Models

on:
  workflow_dispatch:

permissions:
  contents: write


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Observatory repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Observatory dependencies
        run: |
          python -m pip install -r requirements.txt
          git clone --depth 1 https://github.com/quickmt/quickmt.git /tmp/quickmt
          python -m pip install /tmp/quickmt

      - name: Install llama.cpp build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcurl4-openssl-dev

      - name: Build latest llama.cpp server
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          echo "LLAMA_CPP_COMMIT=$(git -C /tmp/llama.cpp rev-parse HEAD)" >> "$GITHUB_ENV"

          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DLLAMA_CURL=ON

          cmake --build /tmp/llama.cpp/build \
            --target llama-server \
            -j2

      - name: Generate blind Chinese translation benchmark
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          LLAMA_SERVER_BIN: /tmp/llama.cpp/build/bin/llama-server
          LLAMA_CPP_COMMIT: ${{ env.LLAMA_CPP_COMMIT }}
        run: python scripts/benchmark_chinese_translation.py

      - name: Commit Chinese benchmark
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add review/translations/chinese-benchmark/latest.json

          git diff --cached --quiet || \
            git commit -m "data: generate Chinese translation benchmark"

          git push

name: Generate Event Cluster Calibration

on:
  workflow_dispatch:

permissions:
  contents: write


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-event-clustering-${{ runner.os }}-multilingual-minilm-v1

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate blind calibration pairs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          EVENT_EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
          EVENT_MAX_DAY_GAP: "4"
        run: python scripts/generate_cluster_calibration.py

      - name: Commit calibration sample
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add review/events/calibration/pairs.json
          git diff --cached --quiet || git commit -m "data: generate event-cluster calibration sample"
          git push

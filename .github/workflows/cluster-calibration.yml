name: Generate Event Cluster Calibration

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache Hugging Face model
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-event-clustering-${{ runner.os }}-multilingual-minilm-v1

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate blind calibration pairs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          EVENT_EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
          EVENT_MAX_DAY_GAP: "4"
        run: python scripts/generate_cluster_calibration.py

      - name: Propose commit calibration sample
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            review/events/calibration/pairs.json
          branch: automation/cluster-calibration
          branch-suffix: timestamp
          sign-commits: true
          commit-message: Generate event-cluster calibration sample
          title: Generate event-cluster calibration sample
          body: |
            Automated Observatory output. Review the generated files before merging.

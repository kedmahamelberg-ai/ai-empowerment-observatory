name: Classify Coverage and Event Lenses

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage7c-dual-lens-${{ github.repository }}
  cancel-in-progress: false

jobs:
  pass_1:
    name: Classification pass 1
    runs-on: ubuntu-latest
    timeout-minutes: 285
    outputs:
      complete: ${{ steps.stage7c.outputs.complete }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      LLAMA_SERVER_BIN: /tmp/llama.cpp/build/bin/llama-server
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Cache Qwen model files
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-aieo-qwen3-4b-gguf-q4-k-m-v1
      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -m pip install "huggingface_hub>=0.34,<2"
      - name: Install llama.cpp build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcurl4-openssl-dev
      - name: Build llama.cpp server
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=ON
          cmake --build /tmp/llama.cpp/build --target llama-server -j2
      - name: Run bounded Stage 7C pass 1
        id: stage7c
        run: |
          set -euo pipefail
          status_file="$RUNNER_TEMP/stage7c-status-${GITHUB_JOB}.json"
          python scripts/classify_dual_lens.py \
            --time-budget-minutes "225" \
            --status-output "$status_file"
          python - "$status_file" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          status_path, output_path = sys.argv[1:]
          with open(status_path, encoding="utf-8") as handle:
              status = json.load(handle)
          complete = "true" if status.get("complete") is True else "false"
          with open(output_path, "a", encoding="utf-8") as handle:
              handle.write(f"complete={complete}\n")
          print(json.dumps(status, indent=2))
          PY
      - name: Commit completed Stage 7C outputs safely
        if: steps.stage7c.outputs.complete == 'true'
        run: |
          bash scripts/commit_generated_files.sh \
            "data: refresh Stage 7C dual-lens classification [$(date -u +%Y-%m-%d)]" \
            main review/classification/latest.json data/lenses/latest.json

  pass_2:
    name: Classification pass 2
    needs: pass_1
    if: needs.pass_1.outputs.complete != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 285
    outputs:
      complete: ${{ steps.stage7c.outputs.complete }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      LLAMA_SERVER_BIN: /tmp/llama.cpp/build/bin/llama-server
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Cache Qwen model files
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-aieo-qwen3-4b-gguf-q4-k-m-v1
      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -m pip install "huggingface_hub>=0.34,<2"
      - name: Install llama.cpp build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcurl4-openssl-dev
      - name: Build llama.cpp server
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=ON
          cmake --build /tmp/llama.cpp/build --target llama-server -j2
      - name: Resume bounded Stage 7C pass 2
        id: stage7c
        run: |
          set -euo pipefail
          status_file="$RUNNER_TEMP/stage7c-status-${GITHUB_JOB}.json"
          python scripts/classify_dual_lens.py \
            --time-budget-minutes "225" \
            --status-output "$status_file"
          python - "$status_file" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          status_path, output_path = sys.argv[1:]
          with open(status_path, encoding="utf-8") as handle:
              status = json.load(handle)
          complete = "true" if status.get("complete") is True else "false"
          with open(output_path, "a", encoding="utf-8") as handle:
              handle.write(f"complete={complete}\n")
          print(json.dumps(status, indent=2))
          PY
      - name: Commit completed Stage 7C outputs safely
        if: steps.stage7c.outputs.complete == 'true'
        run: |
          bash scripts/commit_generated_files.sh \
            "data: refresh Stage 7C dual-lens classification [$(date -u +%Y-%m-%d)]" \
            main review/classification/latest.json data/lenses/latest.json

  pass_3:
    name: Classification pass 3
    needs: [pass_1, pass_2]
    if: >-
      always() &&
      needs.pass_1.result == 'success' &&
      needs.pass_1.outputs.complete != 'true' &&
      needs.pass_2.result == 'success' &&
      needs.pass_2.outputs.complete != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 285
    outputs:
      complete: ${{ steps.stage7c.outputs.complete }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      LLAMA_SERVER_BIN: /tmp/llama.cpp/build/bin/llama-server
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Cache Qwen model files
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-aieo-qwen3-4b-gguf-q4-k-m-v1
      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -m pip install "huggingface_hub>=0.34,<2"
      - name: Install llama.cpp build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcurl4-openssl-dev
      - name: Build llama.cpp server
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=ON
          cmake --build /tmp/llama.cpp/build --target llama-server -j2
      - name: Resume bounded Stage 7C pass 3
        id: stage7c
        run: |
          set -euo pipefail
          status_file="$RUNNER_TEMP/stage7c-status-${GITHUB_JOB}.json"
          python scripts/classify_dual_lens.py \
            --time-budget-minutes "225" \
            --status-output "$status_file"
          python - "$status_file" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          status_path, output_path = sys.argv[1:]
          with open(status_path, encoding="utf-8") as handle:
              status = json.load(handle)
          complete = "true" if status.get("complete") is True else "false"
          with open(output_path, "a", encoding="utf-8") as handle:
              handle.write(f"complete={complete}\n")
          print(json.dumps(status, indent=2))
          PY
      - name: Commit completed Stage 7C outputs safely
        if: steps.stage7c.outputs.complete == 'true'
        run: |
          bash scripts/commit_generated_files.sh \
            "data: refresh Stage 7C dual-lens classification [$(date -u +%Y-%m-%d)]" \
            main review/classification/latest.json data/lenses/latest.json

  ensure_complete:
    name: Require complete classification
    needs: [pass_1, pass_2, pass_3]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PASS_1_COMPLETE: ${{ needs.pass_1.outputs.complete }}
      PASS_2_COMPLETE: ${{ needs.pass_2.outputs.complete }}
      PASS_3_COMPLETE: ${{ needs.pass_3.outputs.complete }}
    steps:
      - name: Require a completed Stage 7C run
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PASS_1_COMPLETE" == "true" || \
                "$PASS_2_COMPLETE" == "true" || \
                "$PASS_3_COMPLETE" == "true" ]]; then
            echo "Stage 7C completed successfully."
            exit 0
          fi
          echo "::error::Stage 7C did not complete within three resumable passes. No downstream release was started."
          exit 1

name: Backfill Historical Human-AI Relationship Patterns

on:
  workflow_dispatch:
    inputs:
      lens:
        description: "Backfill both lenses or one lens only"
        required: true
        default: both
        type: choice
        options:
          - both
          - event
          - coverage
      batch_size:
        description: "Maximum units in this resumable batch"
        required: true
        default: "100"
        type: string

permissions:
  contents: read

concurrency:
  group: aieo-symbiosis-history-backfill
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AIEO_AI_PROVIDER: ${{ vars.AIEO_AI_PROVIDER || 'openai' }}
      AIEO_AI_MAX_JOB_USD: ${{ vars.AIEO_AI_MAX_JOB_USD || '0.50' }}
    steps:
      - name: Set the runtime AI usage ledger
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ai-usage"
          echo "AIEO_AI_LEDGER=$RUNNER_TEMP/ai-usage/${GITHUB_JOB}.json" >> "$GITHUB_ENV"
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Validate historical publication inputs
        run: python3 scripts/validate_symbiosis_release_inputs.py --scope history
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "huggingface_hub>=0.34,<2"
      - name: Resolve scheduled AI model and check the API secret
        run: python scripts/ai_runtime.py --preflight --export
      - name: Install llama.cpp build dependencies
        if: env.AIEO_AI_PROVIDER == 'local'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcurl4-openssl-dev
      - name: Build llama.cpp server
        if: env.AIEO_AI_PROVIDER == 'local'
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=ON
          cmake --build /tmp/llama.cpp/build --target llama-server -j2
      - name: Classify next historical batch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          LLAMA_SERVER_BIN: /tmp/llama.cpp/build/bin/llama-server
        run: |
          python scripts/classify_symbiosis.py \
            --scope history \
            --lens "${{ inputs.lens }}" \
            --limit "${{ inputs.batch_size }}"
      - name: Report AI usage
        if: always()
        run: python scripts/ai_runtime.py --report
      - name: Keep AI usage counts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-usage-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ai-usage/*.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Build cumulative historical review workbench
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/build_symbiosis_review_workbench.py --scope history
      - name: Upload cumulative workbench
        uses: actions/upload-artifact@v7
        with:
          name: historical-symbiosis-review-${{ github.run_id }}
          path: |
            review/symbiosis/workbench.html
            review/symbiosis/workbench-data.json
            review/symbiosis/latest.json
          retention-days: 30

name: Recover Historical AIEO Brief Discovery Evidence

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Inspect snippets without writing evidence"
        required: true
        default: true
        type: boolean
      limit_searches:
        description: "Limit raw search files for testing. Use 0 for all."
        required: true
        default: "5"
        type: string

permissions:
  contents: read

concurrency:
  group: aieo-brief-discovery-evidence
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install "supabase>=2,<3"
      - name: Recover archived Google News evidence
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RAW_NEWS_BUCKET: raw-news
        shell: bash
        run: |
          set -euo pipefail
          args=(--limit-searches "${{ inputs.limit_searches }}")
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then args+=(--dry-run); fi
          python scripts/brief_recover_discovery_evidence.py "${args[@]}"

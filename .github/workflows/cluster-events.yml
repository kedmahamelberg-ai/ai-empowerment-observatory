name: Cluster AI News Events

on:
  workflow_dispatch:

permissions:
  contents: write


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache Hugging Face model
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-event-clustering-${{ runner.os }}-multilingual-minilm-v1

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Cluster latest collection into unique events
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          EVENT_EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
          EVENT_SIMILARITY_THRESHOLD: "0.82"
          EVENT_MAX_DAY_GAP: "4"
        run: python scripts/cluster_events.py

      - name: Commit provisional event review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add review/events/latest.json
          git diff --cached --quiet || git commit -m "data: refresh provisional event clusters [$(date -u +%Y-%m-%d)]"
          git push

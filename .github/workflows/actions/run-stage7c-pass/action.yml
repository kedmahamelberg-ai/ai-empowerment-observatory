name: Run bounded Stage 7C pass
description: Install the local classifier and run one resumable Stage 7C pass.

inputs:
  time-budget-minutes:
    description: Application-level runtime budget for this pass.
    required: true

outputs:
  complete:
    description: Whether all Coverage and Event classifications finished.
    value: ${{ steps.classify.outputs.complete }}

runs:
  using: composite
  steps:
    - name: Cache Qwen model files
      uses: actions/cache@v6
      with:
        path: ~/.cache/huggingface/hub
        key: ${{ runner.os }}-aieo-qwen3-4b-gguf-q4-k-m-v1
    - name: Install Python dependencies
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install -r requirements.txt
        python -m pip install "huggingface_hub>=0.34,<2"
    - name: Install llama.cpp build dependencies
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libcurl4-openssl-dev
    - name: Build llama.cpp server
      shell: bash
      run: |
        set -euo pipefail
        git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
        cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build \
          -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=ON
        cmake --build /tmp/llama.cpp/build --target llama-server -j2
    - name: Classify both Observatory lenses
      id: classify
      shell: bash
      run: |
        set -euo pipefail
        status_file="$RUNNER_TEMP/stage7c-status-${GITHUB_JOB}.json"
        python scripts/classify_dual_lens.py \
          --time-budget-minutes "${{ inputs.time-budget-minutes }}" \
          --status-output "$status_file"
        python - "$status_file" "$GITHUB_OUTPUT" <<'PY'
        import json
        import sys

        status_path, output_path = sys.argv[1:]
        with open(status_path, encoding="utf-8") as handle:
            status = json.load(handle)
        complete = "true" if status.get("complete") is True else "false"
        with open(output_path, "a", encoding="utf-8") as handle:
            handle.write(f"complete={complete}\n")
        print(json.dumps(status, indent=2))
        PY

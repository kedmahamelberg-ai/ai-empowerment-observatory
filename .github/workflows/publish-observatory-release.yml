name: Publish Observatory Release

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install publication dependencies
        run: >-
          python -m pip install
          "supabase>=2.18,<3"
          "reportlab>=4.4,<5"
      - name: Materialize saved relationship classifications
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/publish_symbiosis_release.py
      - name: Reject missing or partial relationship results before commit
        run: python scripts/validate_public_relationship_consistency.py
      - name: Commit complete relationship artifact
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t generated_files < <(find data/symbiosis -type f -name '*.json' -print | sort)
          if (( ${#generated_files[@]} == 0 )); then
            echo "::error::No generated relationship JSON files were found."
            exit 1
          fi
          bash scripts/commit_generated_files.sh \
            "Publish saved relationship results [$(date -u +%Y-%m-%d)]" \
            main \
            "${generated_files[@]}"
      - name: Refresh after relationship commit
        run: git pull --ff-only origin main
      - name: Regenerate release-bound public derivatives
        run: |
          python scripts/generate_public_insights.py
          python scripts/generate_public_brief.py
      - name: Commit release-bound public derivatives
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/insights/latest.json data/history/releases.json \
            data/reports/latest.json reports/ai-empowerment-pulse-latest.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Refresh release-bound public derivatives"
            git push origin HEAD:main
          else
            echo "Public derivatives are unchanged."
          fi
      - name: Refresh after derivative commit
        run: git pull --ff-only origin main
      - name: Validate canonical release and every public derivative
        run: python scripts/validate_and_publish_release.py
      - name: Validate relationship arithmetic and people-side derivation
        run: python scripts/validate_public_relationship_consistency.py
      - name: Commit release status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish Observatory release status"
            git push origin HEAD:main
          else
            echo "Release status is unchanged."
          fi
      - name: Refresh after status commit
        run: git pull --ff-only origin main
      - name: Build public site artifact once
        run: python scripts/build_public_site.py
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: validate-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated GitHub Pages build
        id: deployment
        uses: actions/deploy-pages@v4

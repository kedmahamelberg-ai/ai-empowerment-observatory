name: Publish Observatory Release

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'analytics.js'
      - 'assets/fonts/**'
      - 'about/**'
      - 'config/search-identity.json'
      - 'scripts/search_metadata.py'
      - 'scripts/build_public_site.py'
      - 'index.html'
      - 'site.js'
      - 'public-data.js'
      - 'editorial.css'
      - 'globe.js'
      - 'edu/**'
      - 'report/**'
      - 'reports/index.html'
      - 'reports/reports.js'
      - 'methodology/**'
      - 'validation/corrections/**'
      - 'data/releases/**'
      - 'data/symbiosis/**'
      - 'data/insights/**'
      - 'data/history/**'
      - 'data/reports/**'
      - 'data/status/**'
      - 'reports/ai-empowerment-pulse-latest.pdf'
      - 'review/relationship-audit/**'

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate-and-build:
    outputs:
      brief_release_id: ${{ steps.brief-edition.outputs.release_id }}
      brief_export_sha256: ${{ steps.brief-edition.outputs.export_sha256 }}
      generated_pr: ${{ steps.generated-pr.outputs.pull-request-number }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install publication dependencies
        run: >-
          python -m pip install
          "supabase>=2.18,<3"
          "reportlab>=4.4,<5"
          "PyYAML>=6,<7"
      - name: Materialize saved relationship classifications
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/publish_symbiosis_release.py
      - name: Build public relationship audit index
        run: python scripts/build_relationship_audit.py
      - name: Reject missing or partial relationship results before commit
        run: python scripts/validate_public_relationship_consistency.py
      - name: Stage complete relationship artifacts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t generated_files < <(
            {
              find data/symbiosis -type f \( -name '*.json' -o -name '*.csv' \) -print
              find review/relationship-audit -type f -name '*.json' -print 2>/dev/null || true
            } | sort
          )
          if (( ${#generated_files[@]} == 0 )); then
            echo "::error::No generated relationship JSON files were found."
            exit 1
          fi
          git add -f "${generated_files[@]}"
      - name: Regenerate release-bound public derivatives
        run: |
          python scripts/generate_public_insights.py
          python scripts/generate_public_brief.py
      - name: Validate canonical release and every public derivative
        run: python scripts/validate_and_publish_release.py
      - name: Validate relationship arithmetic and people-side derivation
        run: python scripts/validate_public_relationship_consistency.py
      - name: Build public site artifact once
        run: python scripts/build_public_site.py
      - name: Verify the exact Pages artifact before upload
        run: |
          node --test tests/test_public_display.mjs tests/test_complete_content.mjs
          python scripts/normalize_public_release_copy.py --check
          python scripts/audit_public_signal_denominators.py
          python scripts/validate_public_site_artifact.py
      - name: Record the exact Brief export being deployed
        id: brief-edition
        run: python scripts/notify_brief_publication.py --record-artifact _site/data/brief/current.json
      - name: Propose validated Observatory publication
        id: generated-pr
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            data/symbiosis
            review/relationship-audit
            data/insights/latest.json
            data/history/releases.json
            data/reports/latest.json
            reports/ai-empowerment-pulse-latest.pdf
            data/status/latest.json
          branch: automation/publish-observatory-release
          branch-suffix: timestamp
          sign-commits: true
          commit-message: Publish validated Observatory release data
          title: Publish validated Observatory release data
          body: |
            Automated release data passed the publication validation. Review before merging.
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: needs.validate-and-build.outputs.generated_pr == ''
    needs: validate-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated GitHub Pages build
        id: deployment
        uses: actions/deploy-pages@v4

  notify-brief:
    needs: [validate-and-build, deploy]
    uses: ./.github/workflows/notify-brief-publication.yml
    with:
      release_id: ${{ needs.validate-and-build.outputs.brief_release_id }}
      export_sha256: ${{ needs.validate-and-build.outputs.brief_export_sha256 }}
    secrets: inherit

name: Enrich New AIEO Brief Article Bodies

on:
  workflow_call:
    outputs:
      new_bodies_saved:
        value: ${{ jobs.enrich.outputs.new_bodies_saved }}
    inputs:
      scope:
        required: false
        default: latest_collection
        type: string
      release_id:
        required: false
        default: ""
        type: string
      retry_mode:
        required: false
        default: retryable
        type: string
  workflow_run:
    workflows:
      - Update AI News Collection
    types:
      - completed
  workflow_dispatch:
    inputs:
      scope:
        description: "Which articles should be enriched"
        required: true
        default: latest_collection
        type: choice
        options: [latest_collection, release, all]
      release_id:
        description: "Required only when scope is release, for example 2026-W35"
        required: false
        default: ""
        type: string
      retry_mode:
        description: "Whether previously failed sources should be retried"
        required: true
        default: retryable
        type: choice
        options: [none, retryable, all]

permissions:
  contents: read

concurrency:
  group: aieo-brief-current-source-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 145
    outputs:
      new_bodies_saved: ${{ steps.finish.outputs.new_bodies_saved }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install source extraction dependencies
        run: |
          python -m pip install -r requirements-extraction.txt
          python -m playwright install --with-deps chromium
      - name: Check article recovery before writing any snapshots
        env:
          AIEO_TEST_BROWSER: "1"
        run: |
          AIEO_AI_PROVIDER=local python -m unittest discover -s tests -p 'test_article_body_recovery.py' -v
          AIEO_AI_PROVIDER=local python -m unittest discover -s tests -p 'test_article_consent.py' -v

      - name: Validate private body-evidence contract
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/validate_body_evidence_contract.py

      - name: Recover every source in bounded resumable passes
        id: recover
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          AIEO_RENDER_ARTICLES: "1"
          RECOVERY_SCOPE: ${{ inputs.scope || 'latest_collection' }}
          RECOVERY_RELEASE: ${{ inputs.release_id || '' }}
          RECOVERY_RETRY: ${{ inputs.retry_mode || 'retryable' }}
          RECOVERY_SESSION: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p review/body-evidence
          args=(--limit 0 --scope "$RECOVERY_SCOPE" --retry-mode "$RECOVERY_RETRY"
            --max-runtime-minutes 40 --per-source-timeout-seconds 150
            --session-id "$RECOVERY_SESSION")
          if [[ "$RECOVERY_SCOPE" == release ]]; then
            test -n "$RECOVERY_RELEASE" || { echo 'release_id is required'; exit 1; }
            args+=(--release-id "$RECOVERY_RELEASE")
          fi
          for pass in 1 2 3; do
            report="review/body-evidence/pass-$pass.json"
            python scripts/brief_backfill_article_content_resumable.py "${args[@]}" --report-output "$report"
            remaining="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["remaining_unattempted"])' "$report")"
            [[ "$remaining" != 0 ]] || break
          done
          if [[ "$remaining" != 0 ]]; then
            echo '::error::Some sources still await their first attempt. Saved bodies are safe. Run this recovery again to continue.'
            exit 1
          fi
      - name: Summarize saved bodies
        id: finish
        if: always()
        run: |
          python - <<'PY'
          import glob, json, os
          reports = [json.load(open(path)) for path in sorted(glob.glob('review/body-evidence/pass-*.json'))]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as handle:
              handle.write(f"new_bodies_saved={sum(r['new_bodies_saved'] for r in reports)}\n")
          PY

      - name: Audit every stored full body in the selected scope
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RECOVERY_SCOPE: ${{ inputs.scope || 'latest_collection' }}
          RECOVERY_RELEASE: ${{ inputs.release_id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          scope="$RECOVERY_SCOPE"
          release_id="$RECOVERY_RELEASE"
          args=(--scope "$scope" --limit 0)
          if [[ "$scope" == "release" ]]; then
            test -n "$release_id" || { echo "release_id is required for release scope"; exit 1; }
            args+=(--release-id "$release_id")
          fi
          python scripts/audit_brief_article_content.py "${args[@]}"

      - name: Upload body-coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: body-evidence-report-${{ github.run_id }}
          path: review/body-evidence/pass-*
          if-no-files-found: error
          retention-days: 90

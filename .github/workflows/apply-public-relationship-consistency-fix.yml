name: Validate Public Relationship Consistency

on:
  workflow_dispatch:

# This workflow intentionally does not edit or push workflow files.
# Public presentation changes must be committed normally. GitHub Actions then
# validates the committed state and can redeploy it safely.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aieo-public-consistency-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate JavaScript syntax
        run: |
          node --check site.js
          node --check edu/dashboard.js
      - name: Validate current relationship arithmetic
        run: python scripts/validate_public_relationship_consistency.py
      - name: Ensure internal process labels are not exposed in the public interface
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'Model-coded provisional signal|model-coded weekly lens' index.html site.js edu/index.html edu/dashboard.js; then
            echo "Internal process wording is exposed in the public interface."
            exit 1
          fi
  publish:
    needs: validate
    uses: ./.github/workflows/publish-observatory-release.yml
    secrets: inherit

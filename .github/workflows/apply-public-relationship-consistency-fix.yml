name: Validate Public Relationship Consistency

on:
  workflow_dispatch:

# This workflow intentionally does not edit or push workflow files.
# Public presentation changes must be committed normally. GitHub Actions then
# validates the committed state and can redeploy it safely.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aieo-public-consistency-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate JavaScript syntax
        run: |
          node --check site.js
          node --check edu/dashboard.js
      - name: Validate current relationship arithmetic
        run: python scripts/validate_public_relationship_consistency.py
      - name: Validate full multilingual and public-artifact contract
        run: |
          python scripts/validate_multilingual_pipeline.py
          python scripts/normalize_public_release_copy.py --check
          python scripts/audit_public_signal_denominators.py
          python scripts/validate_repository_integrity.py
  publish:
    needs: validate
    uses: ./.github/workflows/publish-observatory-release.yml
    secrets: inherit

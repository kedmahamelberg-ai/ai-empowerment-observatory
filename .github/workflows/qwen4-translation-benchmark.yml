name: Benchmark Qwen3 4B Translation

on:
  workflow_dispatch:

permissions:
  contents: write


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Observatory repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Observatory dependencies
        run: python -m pip install -r requirements.txt

      - name: Install llama.cpp build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcurl4-openssl-dev

      - name: Build llama.cpp server
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          echo "LLAMA_CPP_COMMIT=$(git -C /tmp/llama.cpp rev-parse HEAD)" >> "$GITHUB_ENV"
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DLLAMA_CURL=ON
          cmake --build /tmp/llama.cpp/build --target llama-server -j2

      - name: Start Qwen3-4B Q4_K_M local server
        run: |
          nohup /tmp/llama.cpp/build/bin/llama-server \
            -hf Qwen/Qwen3-4B-GGUF:Q4_K_M \
            --host 127.0.0.1 \
            --port 8080 \
            -c 2048 \
            -np 1 \
            --jinja \
            -ngl 0 \
            > /tmp/llama-server.log 2>&1 &

          for i in $(seq 1 240); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "llama.cpp server is ready"
              exit 0
            fi
            sleep 2
          done

          echo "llama.cpp server did not become healthy"
          cat /tmp/llama-server.log
          exit 1

      - name: Generate blind difficult-case benchmark
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          LLAMA_SERVER_URL: http://127.0.0.1:8080/v1/chat/completions
          LLAMA_CPP_COMMIT: ${{ env.LLAMA_CPP_COMMIT }}
        run: python scripts/benchmark_qwen4_translation.py

      - name: Commit challenge benchmark
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add review/translations/challenge/latest.json
          git diff --cached --quiet || git commit -m "data: generate Qwen3-4B translation challenge"
          git push

name: Resolve AI News Into Events

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AIEO_AI_PROVIDER: openai
      AIEO_AI_MAX_JOB_USD: ${{ vars.AIEO_AI_MAX_JOB_USD || '0.50' }}
      AIEO_AI_MAX_JOB_REQUESTS: ${{ vars.AIEO_AI_MAX_JOB_REQUESTS || '350' }}
      AIEO_AI_MAX_COMPLETION_TOKENS: '2048'
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Check event-resolver database recovery
        run: python -B -m unittest discover -s tests -p 'test_event_resolution_database.py' -v
      - name: Install resolver dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify scheduled API model and key
        run: python scripts/ai_runtime.py --preflight --export
      - name: Check API verifier and model cutover
        run: |
          python -B -m unittest discover -s tests -p 'test_openai_event_verifier.py' -v
          python -B -m unittest discover -s tests -p 'test_ai_runtime.py' -v
      - name: Resolve articles into events
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/resolve_events.py
      - name: Authorize this generated-data commit
        uses: ./.github/actions/authorize-publisher
        with:
          private-key: ${{ secrets.SCHEDULED_PUBLISHER_PRIVATE_KEY }}
      - name: Commit resolved event outputs safely
        run: |
          bash scripts/commit_generated_files.sh \
            "data: resolve AI news into production events [$(date -u +%Y-%m-%d)]" \
            main review/events/assignments/latest.json data/events/latest.json

      - name: Report bounded API usage
        if: always()
        run: python scripts/ai_runtime.py --report
      - name: Retain API usage and decisions
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: event-resolver-api-usage
          path: .ai-usage/
          include-hidden-files: true
          if-no-files-found: ignore

name: Resolve AI News Into Events

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install resolver dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "transformers[torch]==5.14.1"
      - name: Verify ModernBERT tokenizer
        run: |
          python - <<'PY'
          from transformers import AutoTokenizer
          tokenizer = AutoTokenizer.from_pretrained("Juanillaberia/articles-pairs-event-detection")
          print("Tokenizer:", tokenizer.__class__.__name__)
          PY
      - name: Install llama.cpp build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcurl4-openssl-dev
      - name: Build llama.cpp server
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF
          cmake --build /tmp/llama.cpp/build --target llama-server -j2
      - name: Resolve articles into events
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          LLAMA_SERVER_BIN: /tmp/llama.cpp/build/bin/llama-server
        run: python scripts/resolve_events.py
      - name: Commit resolved event outputs safely
        run: |
          bash scripts/commit_generated_files.sh \
            "data: resolve AI news into production events [$(date -u +%Y-%m-%d)]" \
            main review/events/assignments/latest.json data/events/latest.json

name: Build Symbiosis Relationship Lens

on:
  workflow_call:
    inputs:
      release_id:
        required: false
        default: ""
        type: string
      require_complete:
        required: false
        default: false
        type: boolean
      placeholder:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      release_id:
        description: "Weekly release ID, or leave blank for current"
        required: false
        default: ""
        type: string
      require_complete:
        description: "Fail unless every coverage and event unit has human review"
        required: true
        default: true
        type: boolean
      placeholder:
        description: "Create only a release-bound review-in-progress placeholder (no Supabase query)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: aieo-symbiosis-public-artifact
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Create same-release review placeholder
        if: ${{ inputs.placeholder }}
        shell: bash
        run: |
          args=()
          if [[ -n "${{ inputs.release_id }}" ]]; then args+=(--release-id "${{ inputs.release_id }}"); fi
          python scripts/create_symbiosis_placeholder.py "${args[@]}"
      - name: Install relationship publication dependencies
        if: ${{ inputs.placeholder == false }}
        run: python -m pip install -r requirements.txt
      - name: Build relationship artifact from review database
        if: ${{ inputs.placeholder == false }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          args=()
          if [[ -n "${{ inputs.release_id }}" ]]; then args+=(--release-id "${{ inputs.release_id }}"); fi
          if [[ "${{ inputs.require_complete }}" == "true" ]]; then args+=(--require-complete); fi
          python scripts/publish_symbiosis_release.py "${args[@]}"
      - name: Commit relationship artifact
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t generated_files < <(find data/symbiosis -type f -name '*.json' -print | sort)
          if (( ${#generated_files[@]} == 0 )); then
            echo "::error::No generated symbiosis JSON files were found."
            exit 1
          fi
          bash scripts/commit_generated_files.sh \
            "Publish AIEO relationship lens [$(date -u +%Y-%m-%d)]" \
            main \
            "${generated_files[@]}"

name: Audit AIEO Brief Article Content

on:
  workflow_dispatch:
    inputs:
      sample_size:
        description: "Number of current snapshots to preview"
        required: true
        default: "20"
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install "supabase>=2,<3"
      - name: Audit article content
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/audit_brief_article_content.py --limit "${{ inputs.sample_size }}"

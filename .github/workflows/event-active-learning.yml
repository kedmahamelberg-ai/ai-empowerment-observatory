name: Generate Event Identity Active Learning

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Observatory repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install active-learning dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "transformers[torch]==5.14.1" pandas

      - name: Verify ModernBERT tokenizer
        run: |
          python - <<'PY'
          from transformers import AutoTokenizer
          tokenizer = AutoTokenizer.from_pretrained(
              "Juanillaberia/articles-pairs-event-detection"
          )
          print("Tokenizer:", tokenizer.__class__.__name__)
          PY

      - name: Install llama.cpp build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcurl4-openssl-dev

      - name: Build llama.cpp server
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DLLAMA_CURL=ON
          cmake --build /tmp/llama.cpp/build \
            --target llama-server \
            -j2

      - name: Generate high-information event pairs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          LLAMA_SERVER_BIN: /tmp/llama.cpp/build/bin/llama-server
        run: python scripts/generate_event_active_learning.py

      - name: Propose active-learning sample
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            review/events/active-learning/latest.json
          branch: automation/event-active-learning
          branch-suffix: timestamp
          sign-commits: true
          commit-message: Generate event identity active-learning sample
          title: Generate event identity active-learning sample
          body: |
            Automated Observatory output. Review the generated files before merging.

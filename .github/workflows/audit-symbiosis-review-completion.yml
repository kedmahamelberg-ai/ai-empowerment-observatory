name: Audit Symbiosis Review Completion

on:
  workflow_dispatch:
    inputs:
      require_complete:
        description: "Fail unless every published coverage and event unit has explicit human review"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Audit all published historical units
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          args=()
          if [[ "${{ inputs.require_complete }}" == "true" ]]; then args+=(--require-complete); fi
          python scripts/audit_symbiosis_review_completion.py "${args[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: symbiosis-review-completion-${{ github.run_id }}
          path: review/symbiosis/completion-audit.json
          retention-days: 30

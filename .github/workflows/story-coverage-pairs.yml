name: Generate Story Coverage Event Pairs

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Observatory repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install collection dependencies
        run: python -m pip install requests

      - name: Generate story-coverage event pairs
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          STORY_COVERAGE_MAX_TOKENS: "8"
          STORY_COVERAGE_MAX_ARTICLES: "6"
          STORY_COVERAGE_MAX_PAIRS_PER_STORY: "4"
        run: python scripts/generate_story_coverage_pairs.py

      - name: Propose story-coverage sample
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            review/events/story-coverage/latest.json
          branch: automation/story-coverage-pairs
          branch-suffix: timestamp
          sign-commits: true
          commit-message: Generate story-coverage event pairs
          title: Generate story-coverage event pairs
          body: |
            Automated Observatory output. Review the generated files before merging.
